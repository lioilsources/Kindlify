name: kindlify
description: Non-linear navigator for ancient texts from WorldLibraryProject.
publish_to: 'none'
version: 1.2.0

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Immutable models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Local database
  drift: ^2.26.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.29

  # HTTP + streaming
  dio: ^5.8.0+1

  # Markdown rendering
  flutter_markdown: ^0.7.6

  # Navigation
  go_router: ^15.1.2

  # Connectivity
  connectivity_plus: ^6.1.4
  internet_connection_checker_plus: ^2.6.0

  # Fonts (Noto family for multi-script support)
  google_fonts: ^6.2.1

  # Archive (unzip bundles in isolate)
  archive: ^4.0.7

  # Preferences
  shared_preferences: ^2.5.3

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1

  # Intl
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  drift_dev: ^2.26.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    # whole directory: bundles are added by rag/kindlify_sync.py (WorldLibraryProject)
    - assets/bundles/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#E9DDCB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
